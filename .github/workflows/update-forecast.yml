# Refreshes the data and re-runs the model on GitHub's servers, commits the new forecast and
# republishes the dashboard. Anyone with write access starts it under Actions > Update forecast >
# Run workflow. Uncomment the schedule to run it daily.
name: Update forecast

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 12 * * *"   # every day at 12:00 UTC (8:00 ET)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python run_all.py
      - name: Commit the new forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data data/*.csv data/*.json research/*.md
          git diff --cached --quiet || git commit -m "Update forecast data"
          git push

  deploy:
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
